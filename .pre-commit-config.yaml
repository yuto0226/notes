repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, css, astro]
        stages: [pre-commit]
      - id: build
        name: pnpm run build
        entry: pnpm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: update-frontmatter-dates
        name: Update note/essay date & updated frontmatter
        entry: uv run scripts/update_frontmatter.py
        language: system
        files: ^src/content/(notes|essays)/.*\.(md|mdx)$
        exclude: (^|/)mock-[^/]*(/|$)
        stages: [pre-commit]
